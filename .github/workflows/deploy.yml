name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - deploy/github-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Prepare public build environment
        run: cp .env.example .env
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          build-cmd: node ./node_modules/astro/bin/astro.mjs build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
